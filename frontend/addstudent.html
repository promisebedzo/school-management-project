  <body>
    <form>
      <div id="main-container">
        <div id="heading">
          <p>Student forms</p>
        </div>
        <div>
          <label for="firstname"  class="form-label">Firstname:</label>
          <input
            type="text"
            id="firstname"
            class="stu-forms"
            name="firstname"
            placeholder="Enter firstname eg.John"
            required
          />
        </div>
        <div>
          <label for="lastname"  class="form-label">Lastname:</label>
          <input
            type="text"
            id="lastname"
             class="stu-forms"
            name="lastname"
            placeholder="Enter lastname eg.Doe"
            required
          />
        </div>

            placeholder="Enter othernames "

        <div>
          <label for="index" class="form-label">Index:</label>
          <input
            type="text"
            id="index"
             class="stu-forms"
            name="index"
            placeholder="Enter index eg.stu1234"
            required
          />
        </div>
       
        <div >
          <label for="Year"  class="form-label" >Year:</label>
          <select  class="stu-forms">
            <option value="">Select year </option>
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
          </select>
        </div>
         <div id="gender"><label class="stu-forms"  class="form-label">
            <input type="radio" id="male" name="gender"  value="MAle" />
            Male</label>

            Female</label></div>
