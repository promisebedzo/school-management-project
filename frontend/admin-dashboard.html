<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard || BFA</title>
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/admin-style.css">
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">
</head>
<body>
    <main class="dashboard-container">
        <section class="sidebar">
            <div class="sch-badge">
                <img src="images/school-logo.png" alt="School Badge">
            </div>

            <hr class="line">
            
            <div class="navbar">
                <ul>
                    <li><a href="#" class="nav-items">Dashboard</a></li>
                    <li><a href="#" class="nav-items">Staffs</a></li>
                    <li><a href="#" class="nav-items">Students</a></li>
                    <li><a href="#" class="nav-items">Courses</a></li>
                    <li><a href="#" class="nav-items">Class</a></li>
                    <li><a href="#" class="nav-items">Results</a></li>
                    <li><a href="#" class="nav-items">Fees</a></li>
                    <li><a href="#" class="nav-items">Anoucements</a></li>
                </ul>
            </div>
        </section>

        <div class="header">
            <div class="school-details">
                <div class="details-container">
                    <div class="school-name">Bright Future Academy</div>
                    <div class="motto-container">
                        <span class="details">Discipline</span>
                        <span class="indicator">&bull;</span>
                        <span class="details">Knowledge</span>
                        <span class="indicator">&bull;</span>
                        <span class="details">Character</span>
                    </div>
                </div>
            </div>

            <div class="search-bar-container">
                <input type="text" placeholder="search" class="search-bar">

                <button class="search-button">
                    <img src="images/search-icon.png" alt="" class="search-image">
                </button>
            </div>

            <div class="student-container">
                <div class="student-image-container">
                    <img src="images/app.png" alt="Profile Picture">
                </div>
                <div class="student-details">
                    <div class="student-name">
                        Joshua Kwame Arthur
                    </div>

                    <div class="course">Admin</div>
                </div>
            </div>
        </div>

        
    </main>
</body>
</html>
