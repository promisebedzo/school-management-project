<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="student(admin-manage).css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>students</title>
</head>
<body>
  <main id="main-container">
    <section>
          <div id="top-box" class="top-class">
            <div id="topbox-text">
                <p id="toptext-1" class="top-text">Students</p>
                <p id="toptext-2" class="top-text">manage all students in the school</p>
            </div>
                <div id="addstu-box" class="top-class">
                    
                    <button id="addstudent-button"><span>➕</span>Add student</button>
                    
                </div>
          </div>
                      <div id="student-summary">
                          <div id="studentsummary-box1" class="studentsummary-box">
                            <p class="box-p"><span>🧑‍🎓</span>Total number of students</p>
                            <p class="box1-p">450</p>
                            <p class="box-p">All registered student</p>
                          </div>
                                <div id="studentsummary-box2" class="studentsummary-box">
                                  <p class="box-p"><span>✅</span>Active students</p>
                                  <p class="box1-p">430</p>
                                  <p class="box-p">currently active</p>
                                </div>
                                      <div  id="studentsummary-box3" class="studentsummary-box">
                                          <p class="box-p"><span>⏸️</span>Inctive students</p>
                                          <p class="box1-p">20</p>
                                          <p class="box-p">Not active</p>
                                      </div>
                                            <div id="studentsummary-box4" class="studentsummary-box">
                                              <p class="box-p"><span>🆕</span>Newly Admitted this month</p>
                                              <p class="box1-p">15</p>
                                              <p class="box-p">Added this month</p>
                                            </div>
                      </div>
    </section>
  </main>
